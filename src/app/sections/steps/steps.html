<section id="steps" class="bg-[#171816]">
  <div class="container mx-auto px-4 py-10 md:py-12.5 flex flex-col gap-y-10 lg:gap-y-12">
    <div class="flex flex-col gap-y-5.5">
      <div class="flex items-center gap-x-3.5">
        <div class="bg-[#ff503a] h-0.75 w-6"></div>
        <span class="font-[IBM_Plex_Mono] text-[#ADAEA5] text-[clamp(0.8125rem,0.761rem+0.221vw,0.9375rem)] uppercase">{{ t().steps.label }}</span>
      </div>
      <h2 class="title text-white text-[clamp(1.75rem,1.2rem+2vw,3rem)] leading-[1.2] uppercase">{{ t().steps.title }}</h2>
    </div>

    <div class="grid gap-x-8 gap-y-10 sm:grid-cols-2 lg:grid-cols-4">
      @for (step of t().steps.items; track $index; let i = $index) {
        <div class="flex flex-col gap-y-4 border-t border-[#3a3a37] pt-4">
          <span class="title text-[#FF503A] text-[clamp(2rem,1.5rem+1.8vw,2.75rem)] leading-none">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <div class="flex flex-col gap-y-3">
            <span class="title text-white text-[clamp(1.125rem,1rem+0.5vw,1.375rem)] font-bold">{{ step.title }}</span>
            <p class="text-[#ADAEA5] text-[clamp(0.875rem,0.8rem+0.3vw,1rem)] leading-relaxed">{{ step.text }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
