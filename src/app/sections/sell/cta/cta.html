<section id="sell-cta" class="bg-[#171816]">
  <div class="container mx-auto px-4 py-10 md:py-12.5">
    <div class="flex flex-col gap-10 lg:flex-row lg:items-end lg:justify-between lg:gap-20">
      <div class="flex max-w-2xl flex-col gap-y-5.5">
        <div class="flex items-center gap-x-3.5">
          <div class="bg-[#ff503a] h-0.75 w-6"></div>
          <span class="font-[IBM_Plex_Mono] text-[#ADAEA5] text-[clamp(0.8125rem,0.761rem+0.221vw,0.9375rem)] uppercase">{{ t().sellCta.label }}</span>
        </div>
        <h2 class="title text-white uppercase text-[clamp(1.75rem,1.2rem+2vw,3rem)] leading-[1.15]">{{ t().sellCta.title }}</h2>
        <p class="text-[#ADAEA5] text-[clamp(0.9rem,0.8rem+0.4vw,1.15rem)] leading-relaxed">{{ t().sellCta.text }}</p>
      </div>

      <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:gap-x-8">
        <a [routerLink]="i18n.url()" fragment="valuation"
           class="group flex h-13 w-full cursor-pointer items-center justify-between gap-x-8 bg-[#FF503A] px-5 font-semibold text-[#171816] transition-colors duration-200 hover:bg-white sm:w-fit">
          <span>{{ t().sellCta.cta }}</span>
          <svg class="transition-transform duration-200 group-hover:translate-x-1 group-hover:-translate-y-0.5" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 13L13 1M13 13V1H1" stroke-width="1.8" stroke="currentColor" />
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
