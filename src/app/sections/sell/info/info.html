<section id="buy-why" class="bg-white">
  <div class="container mx-auto px-4 py-10 md:py-12.5 flex flex-col gap-y-10">
    <div class="flex flex-col gap-y-5.5">
      <div class="flex items-center gap-x-3.5">
        <div class="bg-[#ff503a] h-0.75 w-6"></div>
        <span class="font-[IBM_Plex_Mono] text-[#555851] text-[clamp(0.8125rem,0.761rem+0.221vw,0.9375rem)] uppercase">{{ t().buy.why.label }}</span>
      </div>
      <h2 class="title text-[#171816] uppercase text-[clamp(1.75rem,1.2rem+2vw,3rem)] leading-[1.15]">{{ t().buy.why.title }}</h2>
    </div>

    <div class="grid gap-10 md:grid-cols-2 lg:grid-cols-4">
      @for (item of t().buy.why.items; track $index) {
        <div class="flex flex-col gap-y-3 border-t border-[#cfd0c7] pt-4">
          <h3 class="text-[clamp(1.1rem,0.95rem+0.6vw,1.5rem)] font-bold">{{ item.title }}</h3>
          <p class="text-[#555851] text-[clamp(0.9rem,0.8rem+0.4vw,1.15rem)] leading-relaxed">{{ item.text }}</p>
        </div>
      }
    </div>
  </div>
</section>

<section id="buy-faq" class="bg-[#F4F3EE]">
  <div class="container mx-auto px-4 py-10 md:py-12.5">
    <div class="flex flex-col gap-y-8">
      <div class="flex flex-col gap-y-5">
        <div class="flex items-center gap-x-3.5">
          <div class="h-0.75 w-6 bg-[#FF503A]"></div>
          <span class="font-[IBM_Plex_Mono] text-[0.8125rem] text-[#555851] uppercase">{{ t().buy.faq.label }}</span>
        </div>
        <h2 class="title text-[clamp(1.75rem,1.2rem+2vw,3rem)] leading-[1.15] text-[#171816] uppercase">{{ t().buy.faq.title }}</h2>
      </div>

      <div class="grid items-start border-t border-[#cfd0c7] lg:grid-cols-2 lg:gap-x-16 xl:gap-x-20">
        @for (faq of t().buy.faq.items; track $index) {
          <div class="border-b border-[#cfd0c7]">
            <h3>
              <button type="button"
                      class="flex w-full cursor-pointer items-center justify-between gap-x-6 py-5 text-left"
                      [attr.aria-expanded]="openIndex() === $index"
                      (click)="toggle($index)">
                <span class="text-[clamp(1rem,0.95rem+0.2vw,1.125rem)] font-semibold text-[#171816]">{{ faq.question }}</span>
                <svg class="shrink-0 text-[#171816]" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 7H13" stroke="currentColor" stroke-width="1.8" />
                  <path class="origin-center transition-transform duration-200"
                        [class]="openIndex() === $index ? 'scale-y-0' : 'scale-y-100'"
                        d="M7 1V13" stroke="currentColor" stroke-width="1.8" />
                </svg>
              </button>
            </h3>
            <div class="grid transition-[grid-template-rows] duration-300"
                 [class]="openIndex() === $index ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
              <div class="overflow-hidden">
                <p class="pb-5 text-[0.9375rem] leading-normal text-[#555851]">{{ faq.answer }}</p>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
