<section class="bg-white">
  <div class="container mx-auto px-4 py-10 md:py-12.5">
    <div class="grid gap-10 lg:grid-cols-2 lg:gap-16 xl:gap-20">
      <div class="flex flex-col gap-y-8 lg:gap-y-10">
        <div class="flex flex-col gap-y-5">
          <div class="flex items-center gap-x-3.5">
            <div class="h-0.75 w-6 bg-[#FF503A]"></div>
            <span class="font-[IBM_Plex_Mono] text-[0.8125rem] text-[#555851] uppercase">{{ t().faq.label }}</span>
          </div>
          <h2 class="title text-[clamp(2.25rem,1.6rem+2.6vw,3.9375rem)] leading-[1.1] text-[#171816] uppercase">{{ t().faq.title }}</h2>
        </div>

        <ul class="border-b border-[#D9D8D0]">
          @for (faq of t().faq.items; track $index) {
            <li class="border-t border-[#D9D8D0]">
              <button type="button"
                      class="flex w-full cursor-pointer items-center justify-between gap-x-6 py-5 text-left"
                      [attr.aria-expanded]="openIndex() === $index"
                      (click)="toggle($index)">
                <span class="text-[clamp(1rem,0.95rem+0.2vw,1.125rem)] font-semibold text-[#171816]">{{ faq.question }}</span>
                <svg class="shrink-0 text-[#171816]" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 7H13" stroke="currentColor" stroke-width="1.8" />
                  <path class="origin-center transition-transform duration-200"
                        [class]="openIndex() === $index ? 'scale-y-0' : 'scale-y-100'"
                        d="M7 1V13" stroke="currentColor" stroke-width="1.8" />
                </svg>
              </button>
              <div class="grid transition-[grid-template-rows] duration-300"
                   [class]="openIndex() === $index ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
                <div class="overflow-hidden">
                  <p class="pb-5 text-[0.9375rem] leading-normal text-[#555851]">{{ faq.answer }}</p>
                </div>
              </div>
            </li>
          }
        </ul>
      </div>

      <div class="flex flex-col bg-[#242422] h-fit p-6 sm:p-8 lg:p-10"
           (mouseenter)="setPaused(true)"
           (mouseleave)="setPaused(false)">
        <div class="flex items-center gap-x-3.5">
          <div class="h-0.75 w-6 bg-[#FF503A]"></div>
          <span class="font-[IBM_Plex_Mono] text-[0.8125rem] text-[#ADAEA5] uppercase">{{ t().faq.reviewsLabel }}</span>
        </div>

        <svg class="mt-5 text-[#FF503A]" width="24" height="20" viewBox="0 0 24 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 20V11.2C0 4.9 3.6 1 9.6 0l.9 2.6C7.6 3.5 6.2 5.4 6 8h4v12H0Zm13.5 0V11.2C13.5 4.9 17.1 1 23.1 0L24 2.6c-2.9.9-4.3 2.8-4.5 5.4h4v12H13.5Z" />
        </svg>

        <div class="mt-8 grid transition-opacity duration-300 lg:mt-12"
             [class]="ready() ? 'opacity-100' : 'opacity-0'">
          @for (review of reviews(); track review.text; let i = $index) {
            <figure class="col-start-1 row-start-1 flex flex-col gap-y-6 transition-opacity duration-300"
                    [class]="i === active() ? 'opacity-100' : 'pointer-events-none opacity-0'"
                    [attr.aria-hidden]="i !== active()">
              <blockquote class="max-w-md text-[clamp(1.125rem,1rem+0.6vw,1.5rem)] leading-[1.4] text-[#F5F3ED]">
                {{ review.text[i18n.lang()] }}
              </blockquote>
            </figure>
          }
        </div>

        <div class="mt-8 flex items-center justify-between gap-x-4 border-t border-white/10 pt-5">
          <a [href]="reviewsUrl" target="_blank" rel="noopener noreferrer"
             class="group flex items-center gap-x-2.5 text-[0.875rem] font-bold text-[#F5F3ED] transition-colors duration-200 hover:text-[#FF503A]">
            <span>{{ t().faq.all }}</span>
            <svg class="text-[#FF503A] transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" width="11" height="11" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 13L13 1M13 13V1H1" stroke-width="1.8" stroke="currentColor" />
            </svg>
          </a>

          <div class="flex gap-x-2">
            <button type="button" [attr.aria-label]="t().faq.prev" (click)="move(-1)"
                    class="flex size-10 cursor-pointer items-center justify-center border border-white/20 text-[#F5F3ED] transition-colors duration-200 hover:border-[#FF503A] hover:bg-[#FF503A] hover:text-[#171816]">
              <svg width="14" height="12" viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 6H1M6 1L1 6l5 5" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
            <button type="button" [attr.aria-label]="t().faq.next" (click)="move(1)"
                    class="flex size-10 cursor-pointer items-center justify-center border border-white/20 text-[#F5F3ED] transition-colors duration-200 hover:border-[#FF503A] hover:bg-[#FF503A] hover:text-[#171816]">
              <svg width="14" height="12" viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 6h12M8 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
