<section id="cars" class="bg-[#E9E8E0]">
  <div class="container mx-auto px-4 py-10 md:py-12.5">
    <div class="grid gap-10 lg:grid-cols-2 lg:gap-16 xl:gap-20">
      <div class="flex flex-col gap-y-8 lg:gap-y-10">
        <div class="flex flex-col gap-y-5.5">
          <div class="flex items-center gap-x-3.5">
            <div class="bg-[#ff503a] h-0.75 w-6"></div>
            <span class="font-[IBM_Plex_Mono] text-[#555851] text-[clamp(0.8125rem,0.761rem+0.221vw,0.9375rem)] uppercase">{{ t().cars.label }}</span>
          </div>
          <h2 class="title text-[#171816] uppercase text-[clamp(2rem,1.4rem+2.2vw,3.25rem)] leading-[1.15]" [innerHTML]="t().cars.title"></h2>
        </div>

        <p class="text-[#555851] text-[clamp(0.9rem,0.8rem+0.4vw,1.15rem)] leading-relaxed">{{ t().cars.text }}</p>

        <div class="relative w-full aspect-video">
          <div
            class="absolute inset-0 overflow-hidden bg-[#171816]"
            (mouseenter)="pause(true)"
            (mouseleave)="pause(false)"
          >
            @for (p of photos; track p.src; let i = $index) {
              <img
                [src]="p.src"
                [alt]="p.alt[i18n.lang()]"
                width="1200"
                height="675"
                decoding="async"
                [attr.fetchpriority]="i === 0 ? 'high' : 'low'"
                class="absolute inset-0 w-full h-full object-cover transition-opacity duration-500 will-change-[opacity]"
                [class]="current() === i ? 'opacity-100 z-10' : 'opacity-0 z-0'"
              />
            }

            <button
              type="button"
              (click)="prev()"
              aria-label="Previous"
              class="absolute left-0 top-1/2 -translate-y-1/2 z-20 bg-[#171816]/70 hover:bg-[#ff503a] text-white w-12 h-12 text-2xl flex items-center justify-center transition-colors cursor-pointer"
            >‹</button>

            <button
              type="button"
              (click)="next()"
              aria-label="Next"
              class="absolute right-0 top-1/2 -translate-y-1/2 z-20 bg-[#171816]/70 hover:bg-[#ff503a] text-white w-12 h-12 text-2xl flex items-center justify-center transition-colors cursor-pointer"
            >›</button>

            <div class="absolute bottom-0 inset-x-0 z-20 flex items-center justify-between px-3 py-2 bg-linear-to-t from-black/60 to-transparent">
              <span class="font-[IBM_Plex_Mono] text-white text-xs">{{ current() + 1 }} / {{ photos.length }}</span>
              <div class="flex gap-x-1.5">
                @for (p of photos; track p.src; let i = $index) {
                  <button
                    type="button"
                    (click)="go(i)"
                    [attr.aria-label]="'Photo ' + (i + 1)"
                    class="h-0.75 w-4 cursor-pointer transition-colors"
                    [class]="current() === i ? 'bg-[#ff503a]' : 'bg-white/50'"
                  ></button>
                }
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-y-8 lg:pt-2">
        @for (item of t().cars.items; track $index) {
          <div class="flex flex-col gap-y-3 border-t border-[#cfd0c7] pt-4">
            <h3 class="title text-[#171816] text-[clamp(1.1rem,0.95rem+0.6vw,1.5rem)] font-bold">{{ item.title }}</h3>
            <p class="text-[#555851] text-[clamp(0.9rem,0.8rem+0.4vw,1.15rem)] leading-relaxed">{{ item.text }}</p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
