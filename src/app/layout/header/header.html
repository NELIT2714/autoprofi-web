<header class="relative z-50 bg-[#F5F3ED]">
  <div class="container mx-auto flex h-20 items-center justify-between px-4">
    <div class="flex items-center xl:gap-x-30">
      <a href="/" (click)="close()">
        <img ngSrc="/images/logo-main.webp" alt="Автовыкуп Харьков" width="212" height="36" priority
             class="h-7 w-auto sm:h-9">
      </a>
      <ul class="hidden gap-x-8 xl:flex">
        @for (link of links; track link.href) {
          <li>
            <a [href]="link.href" class="text-[#555851] transition-colors duration-200 hover:text-[#171816]">
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="hidden items-center gap-x-5 xl:flex">
      <a href="tel:+380999573405" class="cursor-pointer font-[IBM_Plex_Mono] text-[1.1rem] text-[#171816]">+380 99 957 34 05</a>
      <button class="group flex cursor-pointer items-center gap-x-6 border border-[#ADAEA5] px-4.5 py-3.5 font-bold text-[#171816] transition-colors duration-200 hover:border-[#171816] hover:bg-[#171816] hover:text-white">
        <span class="text-[1rem]">Заказать звонок</span>
        <svg class="transition-transform duration-200 group-hover:translate-x-1.5 group-hover:-translate-y-0.5" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0.636353 12.9L12.6364 0.900002M12.6364 12.9V0.900002H0.636353" stroke-width="1.8" stroke="currentColor" />
        </svg>
      </button>
    </div>

    <div class="flex items-center gap-x-1 xl:hidden">
      <a href="tel:+380999573405" aria-label="Позвонить" class="flex size-10 items-center justify-center text-[#171816]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
        </svg>
      </a>
      <button type="button" class="relative size-10 cursor-pointer" aria-label="Меню"
              [attr.aria-expanded]="open()" (click)="toggle()">
        <span class="absolute left-2 h-0.5 w-6 bg-[#171816] transition-all duration-200"
              [class.top-3]="!open()" [class.top-5]="open()" [class.rotate-45]="open()"></span>
        <span class="absolute top-5 left-2 h-0.5 w-6 bg-[#171816] transition-opacity duration-200"
              [class.opacity-0]="open()"></span>
        <span class="absolute left-2 h-0.5 w-6 bg-[#171816] transition-all duration-200"
              [class.top-7]="!open()" [class.top-5]="open()" [class.-rotate-45]="open()"></span>
      </button>
    </div>
  </div>

  @if (open()) {
    <div class="absolute inset-x-0 top-20 border-t border-[#ADAEA5]/40 bg-[#F5F3ED] shadow-lg xl:hidden">
      <div class="container mx-auto px-4 pb-6">
        <ul class="flex flex-col">
          @for (link of links; track link.href) {
            <li class="border-b border-[#ADAEA5]/40">
              <a [href]="link.href" (click)="close()"
                 class="block py-4 text-lg text-[#555851] transition-colors duration-200 hover:text-[#171816]">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
        <a href="tel:+380999573405" class="mt-5 block font-[IBM_Plex_Mono] text-[1.1rem] text-[#171816]">+380 99 957 34 05</a>
        <button type="button" (click)="close()"
                class="group mt-4 flex w-full cursor-pointer items-center justify-between border border-[#ADAEA5] px-4.5 py-3.5 font-bold text-[#171816] transition-colors duration-200 hover:border-[#171816] hover:bg-[#171816] hover:text-white">
          <span>Заказать звонок</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0.636353 12.9L12.6364 0.900002M12.6364 12.9V0.900002H0.636353" stroke-width="1.8" stroke="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  }
</header>
